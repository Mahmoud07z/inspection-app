name: inspection_app
description: "Warehouse Inspection mobile application — Flutter frontend for the Inspection App REST API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────
  # Riverpod: compile-safe, testable, no BuildContext needed for providers.
  # AsyncNotifier handles loading / error / data states out of the box.
  flutter_riverpod: ^2.5.1

  # ── Navigation ────────────────────────────────────────────────
  # Declarative router with deep-link and redirect (auth guard) support.
  go_router: ^14.2.7

  # ── Networking ────────────────────────────────────────────────
  # Dio: interceptors for JWT injection and typed error normalisation.
  dio: ^5.4.3+1

  # ── Secure Storage ────────────────────────────────────────────
  # OS keychain / keystore — used to persist the JWT between sessions.
  flutter_secure_storage: ^9.2.2

  # ── Utilities ─────────────────────────────────────────────────
  intl: ^0.19.0            # Date/time formatting (DateFormat, Intl)
  cupertino_icons: ^1.0.8  # iOS-style icon set

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
