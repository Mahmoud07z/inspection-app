spring.application.name=inspection-app-backend

server.port=8090
server.servlet.context-path=/

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inspection_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Miles2003}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Let Hibernate create/update tables BEFORE data.sql runs
spring.jpa.defer-datasource-initialization=true

# Run data.sql on every startup (INSERT ... ON CONFLICT DO NOTHING keeps it idempotent)
spring.sql.init.mode=always

spring.devtools.restart.enabled=true

# JWT — secret must decode to ≥ 32 bytes (256-bit HMAC-SHA256 minimum)
app.jwt.secret=${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU2Nzg5QUJDREVGR0hJSktM}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springframework.security=INFO
