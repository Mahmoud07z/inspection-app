# ============================================================
# Application
# ============================================================

# Logical name of this application, used in logs and monitoring tools (e.g. Spring Boot Admin).
spring.application.name=inspection-app-backend

# URL prefix for every HTTP endpoint. "/" means no prefix (default root context).
server.servlet.context-path=/

# ============================================================
# DataSource — PostgreSQL connection pool (HikariCP)
# ============================================================

# JDBC connection URL.  Syntax: jdbc:postgresql://<host>:<port>/<database>
# The ${ENV_VAR:default} syntax reads an environment variable and falls back
# to the default value when the variable is not set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inspection_db}

# PostgreSQL login credentials.  Use environment variables in every non-local environment.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Fully-qualified class name of the JDBC driver.
# Spring Boot auto-detects the driver from the URL, but declaring it explicitly
# makes the dependency visible and avoids ambiguity when multiple drivers are on
# the classpath.
spring.datasource.driver-class-name=org.postgresql.Driver

# Maximum number of connections HikariCP keeps open to the database.
# Default is 10.  Tune based on PostgreSQL's max_connections setting and
# the expected concurrent load.
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections HikariCP maintains in the pool.
# Keeping it equal to maximum-pool-size avoids the overhead of creating
# connections under sudden load spikes.
spring.datasource.hikari.minimum-idle=5

# How long (ms) a thread waits for a connection before throwing an exception.
# 30 000 ms = 30 seconds.
spring.datasource.hikari.connection-timeout=30000

# How long (ms) a connection is allowed to sit idle in the pool before being
# closed and removed.  600 000 ms = 10 minutes.
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime (ms) of a connection in the pool regardless of activity.
# Always set this lower than the database's wait_timeout to avoid stale
# connections.  1 800 000 ms = 30 minutes.
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# Spring Data JPA
# ============================================================

# Controls how Hibernate manages the database schema on startup.
# "update"  — adds missing columns/tables and updates existing ones without
#              dropping data.  Safe for development; NEVER use in production.
# "create"  — drops and recreates the schema on every startup (data loss).
# "validate"— only checks that the schema matches the entity model (production-safe).
# "none"    — disables all schema management (use Flyway/Liquibase instead).
spring.jpa.hibernate.ddl-auto=update

# Disables the Open-Session-In-View (OSIV) anti-pattern.
# When true, Hibernate keeps the session open for the entire HTTP request,
# which hides LazyInitializationExceptions but wastes database connections.
# false is the recommended setting for REST APIs.
spring.jpa.open-in-view=false

# Tells Spring Data JPA which database dialect to use so it can generate
# optimized SQL.  Spring Boot auto-detects this, but setting it explicitly
# is safer when multiple databases are on the classpath.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Hibernate
# ============================================================

# Writes every SQL statement Hibernate executes to the log.
# Use in development to understand query behavior.  Disable in production
# to avoid flooding logs and exposing sensitive query data.
spring.jpa.show-sql=true

# Pretty-prints the SQL with indentation and line breaks.
# Only applies when show-sql=true or hibernate.show_sql=true.
spring.jpa.properties.hibernate.format_sql=true

# Appends a comment to each SQL statement showing the originating
# JPQL/Criteria query.  Useful for tracing N+1 issues.
spring.jpa.properties.hibernate.use_sql_comments=true

# Forces all JDBC timestamps to be written and read in UTC.
# Prevents timezone conversion issues when the JVM and database
# run in different timezones.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Batch size for collections fetched with @BatchSize or when using
# batch fetching strategy.  Reduces the number of SELECT statements
# when loading associations.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ============================================================
# SQL logging — Datasource Proxy / Hibernate statistics
# ============================================================

# Enables Hibernate's internal statistics engine (query counts, cache hits, etc.).
# Viewable in logs at DEBUG level or via JMX.  Small performance overhead.
spring.jpa.properties.hibernate.generate_statistics=false

# Prints every SQL statement directly through Hibernate's logger.
# Complementary to show-sql; routes through SLF4J so log level controls output.
logging.level.org.hibernate.SQL=DEBUG

# Logs the actual bound parameter values for each SQL statement.
# TRACE level is required.  Exposes user data — disable in production.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
# Developer Tools
# ============================================================

# Enables automatic application restart when classpath files change.
# Provided by spring-boot-devtools; has no effect in a production JAR.
spring.devtools.restart.enabled=true

# ============================================================
# JWT Authentication
# ============================================================

# HMAC-SHA256 signing secret — Base64-encoded, minimum 256 bits (32 bytes).
#
# !!  REPLACE THIS VALUE BEFORE DEPLOYING  !!
# Generate a secure key with:  openssl rand -base64 64
#
# The value below is a development-only placeholder derived from the
# ASCII sequence a-z + 0-9 + A-L (48 bytes / 384 bits when decoded).
app.jwt.secret=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU2Nzg5QUJDREVGR0hJSktM

# How long (milliseconds) a token remains valid after issuance.
# 86400000 ms = 24 hours.  Reduce in high-security environments.
app.jwt.expiration-ms=86400000

# ============================================================
# Logging
# ============================================================

# Sets the log level for the Spring Security framework.
# INFO shows authentication events.  Use DEBUG to trace filter-chain decisions.
logging.level.org.springframework.security=INFO

# Log level for Spring Data JPA repository layer.
logging.level.org.springframework.data.jpa=DEBUG
