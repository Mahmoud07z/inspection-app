spring.application.name=inspection-app-backend

server.servlet.context-path=/

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inspection_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.devtools.restart.enabled=true

spring.security.user.name=${APP_SECURITY_USERNAME:inspection_admin}
spring.security.user.password=${APP_SECURITY_PASSWORD:inspection_admin_123}
spring.security.user.roles=ADMIN

logging.level.org.springframework.security=INFO
